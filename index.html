<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Place</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <header>
        <h1>My Favorite Place</h1>
        <p>Interactive Map using JavaScript and Leaflet.js</p>
    </header>

    <section class="instructions">
        <h2>Explore the Map</h2>
        <p>Click anywhere on the map to add your favorite place.</p>
        <p>A marker will appear and you can enter the name of the place.</p>
    </section>

    <div id="map"></div>

    <div class="controls">
        <p>Markers Added: <span id="markerCount">0</span></p>
        <button id="clearButton">Clear Markers</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
